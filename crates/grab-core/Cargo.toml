[package]
name = "grab-core"
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
aes = "0.9.4"
bytes = "1.12.1"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
chrono = "0.4.45"
futures-util = "0.3.34"
hex = "0.4.3"
libc = "0.2.191"
m3u8-rs = "6.0.1"
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "socks", "gzip", "brotli", "deflate", "cookies"] }
rquickjs = "0.14.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
axum = "0.8.9"
hex = "0.4.3"
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
